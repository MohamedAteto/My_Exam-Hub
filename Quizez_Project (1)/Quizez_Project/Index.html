<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* Prevent scrolling */
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .login-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
      padding: 4rem 2rem; /* Increased top and bottom padding */
      animation: slideInLeft 1.2s cubic-bezier(.77,0,.175,1) both;
    }
    
    .login-form {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      height: 610px;           /* Set fixed height */
      min-height: 500px;       /* Ensure minimum height */
      display: flex;
      flex-direction: column;
      justify-content: center; /* Vertically center content */
    }
    
    .login-form h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }
    
    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      background: #f9fafb;
      transition: border-color 0.3s ease;
    }
    
    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: #3b82f6;
      background: white;
    }
    
    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
    }
    
    .forgot-password {
      text-align: left;
      display: block;
      font-size: 0.9rem;
      color: #3b82f6;
      margin-bottom: 1.5rem;
      text-decoration: none;
    }
    
    .forgot-password:hover {
      text-decoration: underline;
    }
    
    .sign-in-btn {
      width: 100%;
      background: #dc2626;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-bottom: 1.5rem;
    }
    
    .sign-in-btn:hover {
      background: #b91c1c;
    }
    
    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
      color: #6b7280;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e5e7eb;
    }
    
    .divider span {
      background: white;
      padding: 0 1rem;
      position: relative;
    }
    
    .google-btn {
      width: 100%;
      background: white;
      border: 2px solid #e5e7eb;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 1.5rem;
    }
    
    .google-btn:hover {
      border-color: #d1d5db;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .signup-text {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
    }
    
    .signup-text a {
      color: #3b82f6;
      text-decoration: none;
    }
    
    .signup-text a:hover {
      text-decoration: underline;
    }
    
    .image-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f4f8;
      padding: 2rem;
      position: relative;
      animation: slideInRight 1.2s cubic-bezier(.77,0,.175,1) both;
    }
    
    .image-section::before {
      content: none;
    }
     
    .loading {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .sign-in-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }
 
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
      display: none;
    }

    .success-message {
      background: #dcfce7;
      color: #166534;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border: 1px solid #bbf7d0;
      display: none;
    }

    /* Add entrance animations */
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-80px) scale(0.98);
      }
      80% {
        opacity: 1;
        transform: translateX(8px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(80px) scale(0.98);
      }
      80% {
        opacity: 1;
        transform: translateX(-8px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .image-section {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-section">
      <div class="login-form">
        <h1>Login</h1>
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="input-group">
            <input type="email" id="email" placeholder="Email" required />
          </div>
          <div class="input-group password-group">
            <input type="password" id="password" placeholder="Password" required />
            <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
          </div>
          <div class="input-group">
            <select id="userType" required>
              <option value="" disabled selected>Who are you?</option>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>
          <a href="#" class="forgot-password">Forgot Your Password?</a>
          <button type="submit" class="sign-in-btn" id="signInBtn">
            <span class="loading" id="loadingSpinner"></span>
            <span id="btnText">Sign in</span>
          </button>
          <div class="divider"><span>or</span></div>
          <button type="button" class="google-btn" onclick="signInWithGoogle()">
            <img src="../assets/icons/Google.png" width="20" />
            Sign in With Google
          </button>
          <p class="signup-text">Don't have an account? <a href="#" onclick="goToSignUp()">Sign up</a></p>
        </form>
      </div>
    </div>
    <div class="image-section">
      <!-- Add your image here -->
      <img src="assets\images\Login.png" alt="Login Illustration" style="max-width:90%; max-height:90%; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1);" />
    </div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁';
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      
      // Hide success message
      successDiv.style.display = 'none';
      
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function showSuccess(message) {
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      
      // Hide error message
      errorDiv.style.display = 'none';
      
      successDiv.textContent = message;
      successDiv.style.display = 'block';
    }

    function hideMessages() {
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
    }

    function handleLogin(event) {
      event.preventDefault();

      hideMessages();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const userType = document.getElementById('userType').value;

      if (!email || !password || !userType) {
        showError('Please fill in all fields');
        return;
      }

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }

      // Basic password validation
      if (password.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }

      showLoading(true);

      setTimeout(() => {
        // Store user information
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userType', userType);
        localStorage.setItem('loginTime', new Date().toISOString());

        // Show success message
        showSuccess('Login successful! Redirecting...');

        // Navigate based on user type
        setTimeout(() => {
          if (userType === 'student') {
            window.location.href = 'student_page/Main.html';
          } else if (userType === 'teacher') {
            window.location.href = 'teacher_page/Teacher.html';
          } else {
            window.location.href = '../index.html';
          }
        }, 1000);
      }, 1500);
    }

    function signInWithGoogle() {
      hideMessages();

      const userType = document.getElementById('userType').value;

      if (!userType) {
        showError('Please select whether you are a Student or Teacher first');
        return;
      }

      showLoading(true);

      setTimeout(() => {
        localStorage.setItem('userEmail', userType === 'student' ? 'student@gmail.com' : 'teacher@gmail.com');
        localStorage.setItem('userType', userType);
        localStorage.setItem('loginMethod', 'google');
        localStorage.setItem('loginTime', new Date().toISOString());

        showSuccess('Google login successful! Redirecting...');

        setTimeout(() => {
          if (userType === 'student') {
            window.location.href = 'student_page/Main.html';
          } else if (userType === 'teacher') {
            window.location.href = 'teacher_page/Teacher.html';
          } else {
            window.location.href = '../index.html';
          }
        }, 1000);
      }, 2000);
    }

    function goToSignUp() {
      window.location.href = '../signup_page/signup.html';
    }

    function showLoading(isLoading) {
      const btn = document.getElementById('signInBtn');
      const spinner = document.getElementById('loadingSpinner');
      const btnText = document.getElementById('btnText');
      
      if (isLoading) {
        btn.classList.add('loading');
        spinner.style.display = 'inline-block';
        btnText.textContent = 'Signing in...';
      } else {
        btn.classList.remove('loading');
        spinner.style.display = 'none';
        btnText.textContent = 'Sign in';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('loginForm');
      const inputs = form.querySelectorAll('input, select');
      
      inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            handleLogin(e);
          }
        });
      });
    });
  </script>
</body>
</html>
